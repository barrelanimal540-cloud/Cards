function save(s){try{localStorage.setItem('cards-v1',JSON.stringify(s))}catch(e){}}
function build(cards,topic,nd){
  const now=Date.now(),n0=nd.d===today()?nd.n:0,ok=w=>topic==='all'||w.t===topic;
  const rev=WORDS.filter(w=>ok(w)&&cards[w.id]&&cards[w.id].d<=now).sort((a,b)=>cards[a.id].d-cards[b.id].d);
  const fresh=WORDS.filter(w=>ok(w)&&!cards[w.id]).slice(0,Math.max(0,20-n0));
  return rev.concat(fresh).map(w=>w.id);
}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;const v=s.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));if(v.length)u.voice=v[0];s.speak(u)}catch(e){}}
const fs=w=>w.length<=9?'clamp(48px,17vw,78px)':w.length<=14?'clamp(38px,12vw,56px)':w.length<=22?'clamp(30px,9vw,42px)':'clamp(24px,7.2vw,32px)';
const ex=s=>s.split('*').map((x,i)=>i%2?html`<b key=${i}>${x}</b>`:x);
const FACE={backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden'};
const POS=['translate(0px,0px)','translate(-6px,12px) rotate(-5deg) scale(.965)','translate(8px,22px) rotate(6deg) scale(.93)','translate(0px,40px) rotate(-2deg) scale(.9)'];

function CardView({w,p,flipped,dx=0,drag,hand,L,lang,showTr,setShowTr,ghost}){
  const top=p===0,color=PAL[(w.id*3)%5],q=Math.min(p,3);
  const st=ghost?{zIndex:6,pointerEvents:'none','--dx':ghost.dx+'px','--rot':ghost.dx/18+'deg',animation:'fly'+(ghost.know?'R':'L')+' .46s cubic-bezier(.5,0,.9,.6) forwards'}
    :{zIndex:4-q,opacity:p>=3?0:1,transform:top?'translate('+dx+'px,0) rotate('+dx/18+'deg)':POS[q],transition:drag?'none':'transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s'};
  const tr=lang==='ru'?w.ru:lang==='kk'?w.kk:w.ru+' · '+w.kk;
  const on=top||ghost;
  return html`<div className="absolute inset-0" style=${{...st,perspective:1400,touchAction:top&&!ghost?'pan-y':'auto'}} ...${top&&!ghost?hand:{}}>
    ${top&&!ghost&&html`<${React.Fragment}><div className="absolute z-10 top-4 left-4 rounded-xl bg-[var(--knw)] px-3 py-1 text-sm font-black text-white -rotate-6" style=${{opacity:Math.max(0,Math.min(1,dx/90))}}>${L.know}</div>
    <div className="absolute z-10 top-4 right-4 rounded-xl bg-[var(--rep)] px-3 py-1 text-sm font-black text-white rotate-6" style=${{opacity:Math.max(0,Math.min(1,-dx/90))}}>${L.rep}</div><//>`}
    <div className="absolute inset-0" style=${{transformStyle:'preserve-3d',transition:'transform .6s cubic-bezier(.4,.2,.2,1)',transform:'rotateY('+(flipped?180:0)+'deg)'}}>
      <div className="absolute inset-0 overflow-hidden rounded-[24px] border border-[var(--line)] shadow-[0_14px_30px_rgba(61,15,39,.22)]" style=${{...FACE,background:on?'#0b0b0b':color,transition:'background-color .5s'}}>
        <div className="flex h-full flex-col items-center justify-center px-5 text-center" style=${{opacity:on?1:0,transition:'opacity .4s .12s'}}>
          <span className="absolute left-5 top-4 text-xs font-bold uppercase tracking-widest text-white/50">${L.topics[KEYS.indexOf(w.t)]}</span>
          <span className="mb-4 rounded-full border-2 border-[#e39b3c] px-3 py-1 text-xs font-black tracking-wide text-[#e39b3c]">Band ${w.b}</span>
          <span className="font-black leading-[1.02] tracking-tight text-white [overflow-wrap:anywhere]" style=${{fontSize:fs(w.w)}}>${w.w}</span>
          <span className="absolute bottom-4 text-xs text-white/40">${L.tap}</span>
        </div>
      </div>
      <div className="absolute inset-0 overflow-y-auto rounded-[24px] border border-[var(--line)] bg-[var(--card)] text-[var(--ink)] shadow-[0_14px_30px_rgba(61,15,39,.22)]" style=${{...FACE,transform:'rotateY(180deg)'}}>
        <div className="flex min-h-full flex-col gap-3 p-5">
          <div className="flex items-start justify-between gap-2">
            <div><span className="text-xs font-black tracking-wide text-[#e39b3c]">Band ${w.b}</span><h3 className="text-2xl font-black leading-tight">${w.w}</h3></div>
            <button data-nodrag="1" aria-label=${L.listen} onClick=${e=>{e.stopPropagation();speak(w.w)}} className="shrink-0 rounded-full bg-[var(--bar)] px-3 py-1 text-lg text-white shadow active:scale-95">🔊</button>
          </div>
          <p className="text-[15px] leading-snug text-[var(--mute)]">${w.d}</p>
          <p className="border-l-4 border-[#e39b3c] pl-3 text-[15px] leading-snug">${ex(w.ex)}</p>
          <div className="mt-auto pt-2">
            ${showTr?html`<button data-nodrag="1" onClick=${()=>setShowTr(false)} className="w-full rounded-2xl border border-dashed border-[var(--bar)] bg-[#e39b3c]/20 px-3 py-2.5 text-left text-base font-bold">${tr}<span className="block text-xs font-medium text-[var(--mute)]">${L.hide}</span></button>`
            :html`<button data-nodrag="1" onClick=${()=>setShowTr(true)} className="w-full rounded-2xl bg-[var(--bar)] px-3 py-2.5 text-sm font-bold text-white active:scale-[.98]">${L.show}</button>`}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function App(){
  const [S,setS]=useState(load);
  const [queue,setQueue]=useState(()=>build(S.cards,S.topic,S.nd));
  const [flipped,setFlipped]=useState(false),[showTr,setShowTr]=useState(false),[dx,setDx]=useState(0),[drag,setDrag]=useState(false),[ghost,setGhost]=useState(null),[rs,setRs]=useState(false);
  const busy=useRef(false),rep=useRef(new Set()),g=useRef({on:false,moved:false,x:0,y:0,dx:0});
  const L=LNG[S.lang]||LNG.ru,lang=LNG[S.lang]?S.lang:'ru',topId=queue[0];
  useEffect(()=>{document.documentElement.lang=lang==='kk'?'kk':lang},[lang]);
  useEffect(()=>{setFlipped(false);setShowTr(false)},[topId]);

  function commit(ns){setS(ns);save(ns)}
  function answer(know,dxv){
    if(busy.current||!queue.length)return;
    busy.current=true;setTimeout(()=>{busy.current=false},320);
    const id=queue[0],now=Date.now(),prev=S.cards[id],cards={...S.cards};
    let nd=S.nd.d===today()?{...S.nd}:{d:today(),n:0};
    if(!prev)nd.n++;
    const q=queue.slice(1);
    if(know){const b=rep.current.has(id)?1:Math.min((prev?prev.b:0)+1,5);cards[id]={b,d:now+DAYS[b-1]*DAY};rep.current.delete(id)}
    else{cards[id]={b:0,d:0};rep.current.add(id);q.splice(Math.min(3,q.length),0,id)}
    setGhost({id,know,flipped,dx:dxv||0});setTimeout(()=>setGhost(null),480);
    setQueue(q);setFlipped(false);setShowTr(false);setDx(0);
    commit({...S,cards,nd});
  }
  const ar=useRef();ar.current=answer;
  useEffect(()=>{const h=e=>{if(e.key==='ArrowRight')ar.current(true);else if(e.key==='ArrowLeft')ar.current(false)};window.addEventListener('keydown',h);return ()=>window.removeEventListener('keydown',h)},[]);

  const hand={
    onPointerDown:e=>{if(e.target.closest('[data-nodrag]'))return;g.current={on:true,moved:false,x:e.clientX,y:e.clientY,dx:0};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}},
    onPointerMove:e=>{const c=g.current;if(!c.on)return;const d=e.clientX-c.x,dy=e.clientY-c.y;if(!c.moved&&Math.abs(d)>8&&Math.abs(d)>Math.abs(dy)){c.moved=true;setDrag(true)}if(c.moved){c.dx=d;setDx(d)}},
    onPointerUp:()=>{const c=g.current;if(!c.on)return;c.on=false;setDrag(false);if(c.moved){if(Math.abs(c.dx)>90)answer(c.dx>0,c.dx);else setDx(0)}else setFlipped(f=>!f)},
    onPointerCancel:()=>{g.current.on=false;setDrag(false);setDx(0)}
  };
  function pick(t){const ns={...S,topic:t};commit(ns);setQueue(build(ns.cards,t,ns.nd));setFlipped(false);setShowTr(false)}
  function doReset(){if(!rs){setRs(true);setTimeout(()=>setRs(false),2500);return}rep.current=new Set();const ns={lang:S.lang,topic:S.topic,cards:{},nd:{d:'',n:0}};commit(ns);setQueue(build({},ns.topic,ns.nd));setRs(false)}
  const learned=Object.values(S.cards).filter(c=>c.b>=1).length;

  return html`<div>
    <header className="hdr">
      <div className="flex items-center justify-between gap-3">
        <span className="rounded-[14px] bg-white px-3 py-1 shadow-[0_6px_16px_rgba(0,0,0,.28)]"><img src=${LOGO} alt="Farabi — Atyrau International School" className="block h-[52px] w-auto"/></span>
        <div className="flex gap-1.5">${['ru','kk','en'].map(k=>html`<button key=${k} onClick=${()=>commit({...S,lang:k})} className=${'rounded-full border border-white/50 px-3 py-1 text-xs font-bold '+(k===lang?'bg-white text-[var(--bar)]':'bg-white/10 text-white')}>${k==='kk'?'ҚАЗ':k.toUpperCase()}</button>`)}</div>
      </div>
      <h1 className="mt-4 text-[clamp(60px,20vw,104px)] font-black leading-[.9] tracking-tight">${L.title}</h1>
      <p className="mt-3 text-sm font-semibold italic">“Practice makes perfect… suii” <span className="not-italic opacity-75">— Cristiano Ronaldo</span></p>
    </header>
    <main className="mx-auto max-w-md px-4 pb-10">
      <div className="-mx-4 flex gap-2 overflow-x-auto px-4 py-4 [scrollbar-width:none]">${KEYS.map((k,i)=>html`<button key=${k} onClick=${()=>pick(k)} className=${'whitespace-nowrap rounded-full border px-3.5 py-1.5 text-sm font-semibold '+(k===S.topic?'border-[var(--bar)] bg-[var(--bar)] text-white':'border-[var(--line)] bg-[var(--card)]')}>${L.topics[i]}</button>`)}</div>
      <div className="mb-5 flex justify-between text-xs font-bold text-[var(--mute)]"><span>${L.left}: ${queue.length}</span><span>${L.learned}: ${learned}/${WORDS.length}</span></div>
      ${queue.length||ghost?html`<div className="relative mx-auto h-[clamp(330px,50dvh,470px)] w-[min(88vw,380px)]">
        ${queue.slice(0,4).map((id,p)=>html`<${CardView} key=${id} w=${WORDS[id]} p=${p} flipped=${p===0&&flipped} dx=${dx} drag=${drag} hand=${hand} L=${L} lang=${lang} showTr=${showTr} setShowTr=${setShowTr}/>`)}
        ${ghost&&html`<${CardView} key=${'g'+ghost.id} w=${WORDS[ghost.id]} p=${0} flipped=${ghost.flipped} L=${L} lang=${lang} ghost=${ghost} showTr=${false} setShowTr=${()=>{}}/>`}
      </div>`:html`<div className="mx-auto mt-2 w-[min(88vw,380px)] rounded-[24px] border border-[var(--line)] bg-[var(--card)] p-8 text-center shadow-[0_14px_30px_rgba(61,15,39,.18)]"><div className="text-5xl">🎉</div><h2 className="mt-3 text-3xl font-black">${L.done}</h2><p className="mt-2 text-[var(--mute)]">${L.doneSub}</p></div>`}
      <div className="mx-auto mt-12 grid w-[min(88vw,380px)] grid-cols-2 gap-3">
        <button disabled=${!queue.length} onClick=${()=>answer(false)} className="rounded-2xl bg-[var(--rep)] py-4 text-lg font-black text-white shadow-[0_8px_18px_rgba(138,34,80,.3)] active:scale-[.97] disabled:opacity-40">${L.rep}</button>
        <button disabled=${!queue.length} onClick=${()=>answer(true)} className="rounded-2xl bg-[var(--knw)] py-4 text-lg font-black text-white shadow-[0_8px_18px_rgba(31,74,64,.3)] active:scale-[.97] disabled:opacity-40">${L.know}</button>
      </div>
      <p className="mt-5 text-center text-xs text-[var(--mute)]">${L.swipe}</p>
      <div className="mt-3 text-center"><button onClick=${doReset} className="text-xs font-bold text-[var(--mute)] underline">${rs?L.reset2:L.reset}</button></div>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
